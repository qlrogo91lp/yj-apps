# yj-apps 공통 SwiftLint 규칙.
# 각 앱의 Apps/<앱>/.swiftlint.yml 이 parent_config 로 이 파일을 상속하고,
# 앱 고유 규칙만 그쪽에 둔다. 리스트(opt_in_rules 등)는 부모·자식이 병합된다.

line_length:
  warning: 150
  error: 200

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

disabled_rules:
  - trailing_comma
  - todo
  - opening_brace

opt_in_rules:
  - empty_count
  - closure_spacing
  - first_where
  - modifier_order
  # force_unwrapping 은 강제 언래핑을 "드러내기 위해" 의도적으로 켜 둔다.
  # warning 레벨이라 make lint 는 통과한다.
  # golf 의 maxHole(String) 강제 언래핑 패턴이 대표 사례이며,
  # 모델을 Int/HoleType 으로 바꿀 때 함께 사라진다.
  - force_unwrapping

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 50
    error: 60
