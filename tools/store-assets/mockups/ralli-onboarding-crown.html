<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ralli 온보딩 시안</title>
<style>
  body { margin: 0; padding: 32px; background: #111; color: #eee; font-family: -apple-system, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #999; font-size: 13px; margin: 0 0 20px; line-height: 1.6; }
  .stage { display: block; width: 100%; aspect-ratio: 4 / 5; background: #000; border-radius: 24px; }
  .cap { font-size: 12px; color: #888; margin: 0 0 6px 4px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; }
  .row > div { width: 340px; }
</style>
</head>
<body>
<h1>Ralli 온보딩 1페이지 — 크라운 · 탭으로 점수 넣기 (4:5 · 1200×1500 · 8.8초 반복 · 한국어 / 영어)</h1>
<p>스토어 검색 결과 영상과 같은 장면에서 캡션을 뺀 것. 온보딩 페이지에 제목·본문이 따로 있어 영상에는 글자를 넣지 않는다.
화면 탭과 크라운(위 ME · 아래 OPP)을 번갈아 쓴다. 영상은 <code>--lang ko|en</code> 에 맞는 워치 스크린샷을 쓴다.</p>
<div class="row">
  <div><div class="cap">한국어</div><canvas class="stage" data-scene="ralliOnboardingCrown" data-lang="ko"></canvas></div>
  <div><div class="cap">English</div><canvas class="stage" data-scene="ralliOnboardingCrown" data-lang="en"></canvas></div>
</div>

<script>
(function () {
  const TAU = Math.PI * 2;
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const eOut = t => 1 - Math.pow(1 - t, 3);
  const mod = (a, n) => ((a % n) + n) % n;
  const FONT_T = '-apple-system, system-ui, "Apple SD Gothic Neo", sans-serif';
  const FONT_R = 'ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif';
  // 앱 색 — 워치 숫자는 스크린샷에서 잰 값, 화살표는 SwiftUI .green · .orange (다크)
  const ME = '#30D158', OPP = '#FF9F0A', LIME = '#ADFF41';

  // 점수 — 헤더와 같은 듀스 루프. 2.2초마다 한 포인트, 8.8초에 처음으로 돌아온다
  const D = 1.1, P = D * 8;
  const STATES = [['40', '40'], ['AD', '40'], ['40', '40'], ['40', 'AD']];
  const WINNER = [0, 0, 1, 1];
  const METHOD = ['tap', 'crown', 'tap', 'crown']; // 그 상태로 오게 한 입력 — 검색 결과 · 온보딩에서만 쓴다
  const POINT_AT = 0.8 * D;
  function scoreAt(x, lag = 0) {
    const u = mod(x - POINT_AT - lag, P), idx = Math.floor(u / (2 * D));
    return { idx, since: u - idx * 2 * D, prev: STATES[mod(idx - 1, 4)], cur: STATES[idx] };
  }

  function rr(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function txt(ctx, s, x, y, size, color, o = {}) {
    const { w = 700, align = 'center', family = FONT_T, alpha = 1, italic = false } = o;
    if (alpha <= 0) return;
    ctx.save(); ctx.globalAlpha *= alpha;
    ctx.font = `${italic ? 'italic ' : ''}${w} ${size}px ${family}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillText(s, x, y); ctx.restore();
  }
  function roll(ctx, from, to, p, x, y, size, color, o = {}) {
    if (p >= 1 || from === to) { txt(ctx, to, x, y, size, color, o); return; }
    const e = eOut(clamp(p)), a = o.alpha ?? 1;
    txt(ctx, from, x, y - size * 0.45 * e, size, color, { ...o, alpha: a * (1 - e) });
    txt(ctx, to, x, y + size * 0.45 * (1 - e), size, color, { ...o, alpha: a * e });
  }
  function caption(ctx, parts, cx, y, size, hl) {
    ctx.save(); ctx.font = `700 ${size}px ${FONT_T}`;
    const ws = parts.map(p => ctx.measureText(p[0]).width);
    let x = cx - ws.reduce((a, b) => a + b, 0) / 2;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    parts.forEach((p, i) => { ctx.fillStyle = p[1] ? hl : '#F4F4EF'; ctx.fillText(p[0], x, y); x += ws[i]; });
    ctx.restore();
  }
  // 화면 탭 — 손가락이 닿고 링이 퍼진다. since 는 점수가 들어가는 순간 기준 초
  function tapFx(ctx, x, y, since, R) {
    if (since < -0.22 || since > 0.6) return;
    ctx.save();
    if (since < 0.1) { const a = clamp((since + 0.22) / 0.22); ctx.globalAlpha = 0.5 * a; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, R * 0.3, 0, TAU); ctx.fill(); }
    if (since >= 0) { const p = clamp(since / 0.55); ctx.globalAlpha = 0.75 * (1 - p); ctx.strokeStyle = '#fff'; ctx.lineWidth = R * 0.05; ctx.beginPath(); ctx.arc(x, y, R * (0.3 + 0.8 * eOut(p)), 0, TAU); ctx.stroke(); }
    ctx.restore();
  }

  // ---- 워치 스크린샷 (피그마 Ultra 테두리 3x, 1266x1542 · 30:15) — 언어마다 한 장. 좌표는 이미지에서 잰 값 ----
  const IMG = { en: new Image(), ko: new Image() };
  IMG.en.src = '../inputs/watch-match-en.png';
  IMG.ko.src = '../inputs/watch-match-ko.png';
  const WI = {
    w: 1266, h: 1542, bgL: '#071f0d', bgR: '#261607', numColor: ['#30D158', '#FF9230'],
    en: { col: [423.5, 820], base: 850, numFont: 169, numBox: [700, 885], numHalf: 158, cover: [[774, 346, 824, 404, 'R']] }, // 연결 끊김 아이콘만 지운다
    ko: { col: [411, 833], base: 885, numFont: 180, numBox: [735, 915], numHalf: 150, cover: [[764, 346, 822, 410, 'R']] },
  };
  // 크라운 (이미지 기준) — 위로 돌리면 내 점수, 아래로 돌리면 상대 점수 (CrownPointGate)
  const CROWN = { x0: 1132, x1: 1200, y0: 522, y1: 712 };

  // 이미지 바깥의 어두운 바탕만 투명하게 오린다 — 가장자리에서 출발해 거의 검은 픽셀(max<45)을 따라 채운다.
  // 한국어 스크린샷은 화면 밖으로 초록·갈색 사각형이 삐져나와 있어 임계값을 45 로 둔다 (티타늄 테두리가 막아 화면 안으로는 번지지 않는다).
  // file:// 로 열면 브라우저가 픽셀 읽기를 막아 원본을 그대로 쓴다.
  const CUT = {};
  function cutImage(lang) {
    if (CUT[lang]) return CUT[lang];
    const im = IMG[lang];
    if (!im.complete || !im.naturalWidth) return null;
    try {
      const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height), px = d.data, Wd = c.width, Hd = c.height;
      const seen = new Uint8Array(Wd * Hd), stack = [];
      const dark = i => px[i * 4] < 45 && px[i * 4 + 1] < 45 && px[i * 4 + 2] < 45;
      for (let x = 0; x < Wd; x++) stack.push(x, (Hd - 1) * Wd + x);
      for (let y = 0; y < Hd; y++) stack.push(y * Wd, y * Wd + Wd - 1);
      while (stack.length) {
        const i = stack.pop();
        if (seen[i] || !dark(i)) continue;
        seen[i] = 1; px[i * 4 + 3] = 0;
        const x = i % Wd, y = (i / Wd) | 0;
        if (x > 0) stack.push(i - 1); if (x < Wd - 1) stack.push(i + 1);
        if (y > 0) stack.push(i - Wd); if (y < Hd - 1) stack.push(i + Wd);
      }
      const fr = Math.round(Hd * 0.08); // 밴드가 잘린 위·아래 끝은 투명도로 흐린다
      for (let y = 0; y < fr; y++) {
        const k = y / fr;
        for (let x = 0; x < Wd; x++) { px[(y * Wd + x) * 4 + 3] *= k; px[((Hd - 1 - y) * Wd + x) * 4 + 3] *= k; }
      }
      g.putImageData(d, 0, 0); CUT[lang] = c;
    } catch (e) { CUT[lang] = im; }
    return CUT[lang];
  }
  // 워치를 그리고 점수 숫자만 코드로 바꿔 그린다. 글꼴은 워치 시스템 글꼴(SF Compact). ME/OPP · Undo 는 실제 화면이라 남긴다.
  function watchShot(ctx, x, y, s, score, lang) {
    const im = cutImage(lang), L = WI[lang];
    if (!im) return;
    ctx.drawImage(im, x, y, WI.w * s, WI.h * s);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    for (const [x0, y0, x1, y1, side] of L.cover) { ctx.fillStyle = side === 'L' ? WI.bgL : WI.bgR; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); }
    [0, 1].forEach(i => {
      const cx = L.col[i], [ny0, ny1] = L.numBox;
      ctx.fillStyle = i ? WI.bgR : WI.bgL; ctx.fillRect(cx - L.numHalf, ny0, L.numHalf * 2, ny1 - ny0);
      ctx.save(); ctx.beginPath(); ctx.rect(cx - L.numHalf, ny0, L.numHalf * 2, ny1 - ny0); ctx.clip();
      const draw = (str, dy, a) => {
        if (a <= 0) return;
        ctx.globalAlpha = a; ctx.font = `700 ${L.numFont}px "SF Compact", system-ui`; ctx.fillStyle = WI.numColor[i];
        const m = ctx.measureText(str);
        ctx.fillText(str, cx - (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2 + m.actualBoundingBoxLeft, L.base + dy);
      };
      const p = clamp(score.since / 0.25), e = eOut(p);
      if (score.prev[i] === score.cur[i] || p >= 1) draw(score.cur[i], 0, 1);
      else { draw(score.prev[i], -60 * e, 1 - e); draw(score.cur[i], 60 * (1 - e), e); }
      ctx.restore();
    });
    ctx.restore();
  }
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  // 크라운을 돌리는 손가락 · 톱니가 미끄러지는 결 · 돌리는 방향 화살표. since 는 점수가 들어가는 순간(딸깍) 기준 초
  function crownTurn(ctx, x, y, s, since, up, R) {
    if (since < -0.6 || since > 0.7) return;
    const cx = x + (CROWN.x0 + CROWN.x1) / 2 * s, cy = y + (CROWN.y0 + CROWN.y1) / 2 * s;
    const ch = (CROWN.y1 - CROWN.y0) * s, cw = (CROWN.x1 - CROWN.x0) * s;
    const turn = clamp((since + 0.35) / 0.35);
    const dir = up ? -1 : 1, color = up ? ME : OPP;
    const fade = since < -0.45 ? clamp((since + 0.6) / 0.15) : since > 0.35 ? 1 - clamp((since - 0.35) / 0.35) : 1;
    if (since > -0.4 && since < 0.15) { // 톱니 결 — 돌리는 동안만 미끄러진다
      ctx.save(); rr(ctx, cx - cw / 2, cy - ch / 2, cw, ch, cw * 0.25); ctx.clip();
      const gap = 14 * s, off = mod(dir * turn * 6 * gap, gap);
      ctx.globalAlpha = 0.35 * Math.sin(Math.PI * clamp((since + 0.4) / 0.55)); ctx.fillStyle = '#ffffff';
      for (let yy = cy - ch / 2 - gap + off; yy < cy + ch / 2 + gap; yy += gap) ctx.fillRect(cx - cw / 2, yy, cw, 2.5 * s);
      ctx.restore();
    }
    const fy = cy - dir * ch * 0.22 + dir * ch * 0.44 * ease(turn); // 손가락 — 크라운 옆면을 문지르듯
    ctx.save(); ctx.globalAlpha = 0.5 * fade; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx + cw * 0.9, fy, cw * 0.55, ch * 0.2, 0, 0, TAU); ctx.fill(); ctx.restore();
    const ax = cx + cw * 0.6, a0 = up ? 0.75 : -0.75, a1 = up ? -0.75 : 0.75; // 방향 화살표
    const prog = eOut(clamp((since + 0.35) / 0.4)), aEnd = a0 + (a1 - a0) * prog;
    ctx.save(); ctx.globalAlpha = fade; ctx.strokeStyle = color; ctx.lineWidth = R * 0.09; ctx.lineCap = 'round';
    ctx.shadowColor = color; ctx.shadowBlur = R * 0.15;
    ctx.beginPath(); ctx.arc(ax, cy, R, a0, aEnd, up); ctx.stroke();
    if (prog > 0.15) {
      const hx = ax + R * Math.cos(aEnd), hy = cy + R * Math.sin(aEnd), tang = aEnd + (up ? -Math.PI / 2 : Math.PI / 2), hl = R * 0.27;
      ctx.fillStyle = color; ctx.beginPath();
      ctx.moveTo(hx + Math.cos(tang) * hl, hy + Math.sin(tang) * hl);
      ctx.lineTo(hx + Math.cos(tang + 2.5) * hl, hy + Math.sin(tang + 2.5) * hl);
      ctx.lineTo(hx + Math.cos(tang - 2.5) * hl, hy + Math.sin(tang - 2.5) * hl);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // 워치 하나를 크게 — 한 바퀴(8.8초)에 ME · OPP 가 탭과 크라운을 한 번씩 쓴다. 캡션 없음.
  function ralliOnboardingCrown(ctx, W, H, t, lang) {
    const tt = mod(t, P), L = WI[lang];
    ctx.fillStyle = '#090c08'; ctx.fillRect(0, 0, W, H);
    const gl = ctx.createRadialGradient(W * 0.43, H * 0.5, 0, W * 0.43, H * 0.5, W * 0.62);
    gl.addColorStop(0, 'rgba(173,255,65,0.08)'); gl.addColorStop(1, 'rgba(173,255,65,0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
    const s = (H * 0.82) / WI.h, wx = W * 0.42 - WI.w * s / 2, wy = (H - WI.h * s) / 2;
    const ws = scoreAt(tt, 0);
    watchShot(ctx, wx, wy, s, ws, lang);
    // 다음(또는 방금) 포인트 — 탭과 크라운을 번갈아 쓴다
    const next = ws.since > 1.0, k = mod(ws.idx + (next ? 1 : 0), 4), since = next ? ws.since - 2 * D : ws.since;
    const side = WINNER[k];
    if (METHOD[k] === 'crown') crownTurn(ctx, wx, wy, s, since, side === 0, H * 0.095);
    else tapFx(ctx, wx + L.col[side] * s, wy + (L.base - 60) * s, since, H * 0.12);
  }

  // build-render.py 는 이 선언을 찾아 장면을 꺼낸다
  const scenes = { ralliOnboardingCrown };

  const canvases = [...document.querySelectorAll('canvas[data-scene]')];
  const t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000, dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of canvases) {
      const r = c.getBoundingClientRect();
      const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
      if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
      const ctx = c.getContext('2d');
      ctx.save(); scenes[c.dataset.scene](ctx, w, h, t, c.dataset.lang || 'en'); ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
