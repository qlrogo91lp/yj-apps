name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKSPACE: YJApps.xcworkspace
  XCODE_VERSION: "26.6"
  IOS_DEVICE: "^iPhone"
  WATCH_DEVICE: "^Apple Watch"
  # 린트 도구는 로컬과 같은 버전으로 고정한다. 러너 이미지의 기본 버전을 그대로 쓰면
  # 규칙이 추가된 버전에서 없던 위반이 잡혀 CI 만 빨간불이 된다.
  SWIFTFORMAT_VERSION: "0.61.1"
  SWIFTLINT_VERSION: "0.64.1"

jobs:
  # 변경된 경로로 이후 job 의 실행 여부를 정한다.
  # 코어(Packages/YJKit)가 바뀌면 파급을 잡기 위해 전 앱을 빌드한다 — 여기서 좁히면 안 된다.
  changes:
    name: 변경 경로 판별
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kit: ${{ steps.filter.outputs.kit }}
      golf: ${{ steps.filter.outputs.golf }}
      tennis: ${{ steps.filter.outputs.tennis }}
      haruchi: ${{ steps.filter.outputs.haruchi }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 경로 판별
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          kit=false
          golf=false
          tennis=false
          haruchi=false

          # base 를 못 구하는 경우(첫 푸시, force-push)에는 안전하게 전부 실행한다.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "base 커밋을 확인할 수 없다 — 전 대상을 실행한다"
            kit=true; golf=true; tennis=true; haruchi=true
          else
            changed=$(git diff --name-only "$base" "$head")
            echo "--- 변경된 파일 ---"
            echo "$changed"
            echo "-------------------"

            # 문서는 빌드 산출물에 영향을 주지 않으므로 판정에서 뺀다.
            # 코드 디렉터리 안에 있는 문서(Packages/YJKit/docs/, Apps/*/CLAUDE.md 등)가
            # 아래 경로 패턴에 걸려 전 앱 빌드를 돌리던 것을 막는 것이 목적이다.
            # grep 이 하나도 못 맞히면 종료 코드가 1 이라 || true 가 필요하다 — 러너 셸은 set -e 다.
            relevant=$(echo "$changed" | grep -vE '(^|/)docs/|\.md$' || true)
            if [ -z "$relevant" ]; then
              echo "문서만 바뀌었다 — 빌드·테스트를 건너뛴다"
            fi

            # 루트 설정과 워크스페이스는 전 대상에 영향을 준다.
            if echo "$relevant" | grep -qE '^(\.github/|Makefile|\.swiftlint\.yml|YJApps\.xcworkspace/)'; then
              kit=true; golf=true; tennis=true; haruchi=true
            fi
            # 코어 변경은 전 앱으로 파급된다.
            if echo "$relevant" | grep -qE '^Packages/YJKit/'; then
              kit=true; golf=true; tennis=true; haruchi=true
            fi
            if echo "$relevant" | grep -qE '^Apps/GolfCounter/'; then
              golf=true
            fi
            if echo "$relevant" | grep -qE '^Apps/TennisCounter/'; then
              tennis=true
            fi
            if echo "$relevant" | grep -qE '^Apps/HaruchiFit/'; then
              haruchi=true
            fi
          fi

          {
            echo "kit=$kit"
            echo "golf=$golf"
            echo "tennis=$tennis"
            echo "haruchi=$haruchi"
          } >> "$GITHUB_OUTPUT"
          echo "판별 결과 — kit=$kit golf=$golf tennis=$tennis haruchi=$haruchi"

  lint:
    name: 린트
    needs: changes
    if: needs.changes.outputs.golf == 'true' || needs.changes.outputs.tennis == 'true' || needs.changes.outputs.haruchi == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 러너에 미리 깔린 버전을 쓰면 이미지가 바뀔 때마다 결과가 흔들린다.
      # 실제로 brew 가 설치한 swiftformat 0.62.1 이 로컬(0.61.1)에 없던
      # wrapIfStatementBodies 위반 3건을 잡아 실패한 적이 있다.
      - name: 린트 도구 설치 (버전 고정)
        run: |
          tools="$RUNNER_TEMP/lint-tools"
          mkdir -p "$tools"

          curl -fsSL -o "$tools/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          curl -fsSL -o "$tools/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"

          unzip -q -o "$tools/swiftformat.zip" -d "$tools"
          unzip -q -o "$tools/swiftlint.zip" -d "$tools"
          chmod +x "$tools/swiftformat" "$tools/swiftlint"

          # 러너 기본 설치본보다 앞서도록 PATH 맨 앞에 둔다.
          echo "$tools" >> "$GITHUB_PATH"

      - name: 도구 버전 확인
        run: |
          echo "swiftformat: $(swiftformat --version)"
          echo "swiftlint:   $(swiftlint --version)"

      # 기준선이 초록이므로 위반이 하나라도 생기면 실패한다 (설계 문서 5.4).
      - name: swiftlint
        run: make lint

      - name: swiftformat --lint
        run: make format

  kit-test:
    name: YJKit 테스트
    needs: changes
    if: needs.changes.outputs.kit == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 선택
        run: .github/scripts/select-xcode.sh

      - name: 시뮬레이터 선택
        id: sim
        run: |
          udid=$(.github/scripts/pick-simulator.sh iOS "$IOS_DEVICE")
          echo "ios=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      # swift test 는 쓸 수 없다 — Package.swift 가 macOS 플랫폼을 선언하지 않아
      # 호스트 빌드가 실패한다 (설계 문서 4절).
      - name: 패키지 테스트
        run: make kit-test KIT_DESTINATION="id=${{ steps.sim.outputs.ios }}"

  golf-ios:
    name: GolfCounter (iOS)
    needs: changes
    if: needs.changes.outputs.golf == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 선택
        run: .github/scripts/select-xcode.sh

      - name: 시뮬레이터 선택
        id: sim
        run: |
          echo "ios=$(.github/scripts/pick-simulator.sh iOS "$IOS_DEVICE")" >> "$GITHUB_OUTPUT"

      - name: iOS 앱 테스트
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "GolfCounter" \
            -destination "id=${{ steps.sim.outputs.ios }}" \
            CODE_SIGNING_ALLOWED=NO -quiet test

  golf-watch:
    name: GolfCounter (watchOS)
    needs: changes
    if: needs.changes.outputs.golf == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 선택
        run: .github/scripts/select-xcode.sh

      - name: 시뮬레이터 선택
        id: sim
        run: |
          echo "watch=$(.github/scripts/pick-simulator.sh watchOS "$WATCH_DEVICE")" >> "$GITHUB_OUTPUT"

      # 워치 앱 스킴에는 iOS 앱과 iOS 테스트 타깃까지 들어 있다 — watchOS 앱이 iOS 앱에
      # 임베드되는 구조라 Xcode 가 호스트 앱을 스킴에 자동으로 넣기 때문이다.
      # -only-testing 으로 좁히지 않으면 *-ios job 이 이미 돌린 테스트를 그대로 다시 돌린다.
      - name: Watch 앱 테스트
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "GolfCounter Watch App" \
            -destination "id=${{ steps.sim.outputs.watch }}" \
            -only-testing:GolfCounterWatchTests \
            CODE_SIGNING_ALLOWED=NO -quiet test

      - name: 컴플리케이션 빌드
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "GolfComplicationExtension" \
            -destination "id=${{ steps.sim.outputs.watch }}" \
            CODE_SIGNING_ALLOWED=NO -quiet build

  tennis-ios:
    name: TennisCounter (iOS)
    needs: changes
    if: needs.changes.outputs.tennis == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 선택
        run: .github/scripts/select-xcode.sh

      - name: 시뮬레이터 선택
        id: sim
        run: |
          echo "ios=$(.github/scripts/pick-simulator.sh iOS "$IOS_DEVICE")" >> "$GITHUB_OUTPUT"

      - name: iOS 앱 테스트
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "TennisCounter" \
            -destination "id=${{ steps.sim.outputs.ios }}" \
            CODE_SIGNING_ALLOWED=NO -quiet test

      - name: LiveActivity 빌드
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "TennisLiveActivityExtension" \
            -destination "id=${{ steps.sim.outputs.ios }}" \
            CODE_SIGNING_ALLOWED=NO -quiet build

  tennis-watch:
    name: TennisCounter (watchOS)
    needs: changes
    if: needs.changes.outputs.tennis == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 선택
        run: .github/scripts/select-xcode.sh

      - name: 시뮬레이터 선택
        id: sim
        run: |
          echo "watch=$(.github/scripts/pick-simulator.sh watchOS "$WATCH_DEVICE")" >> "$GITHUB_OUTPUT"

      # 워치 앱 스킴에는 iOS 앱과 iOS 테스트 타깃까지 들어 있다 — watchOS 앱이 iOS 앱에
      # 임베드되는 구조라 Xcode 가 호스트 앱을 스킴에 자동으로 넣기 때문이다.
      # -only-testing 으로 좁히지 않으면 *-ios job 이 이미 돌린 테스트를 그대로 다시 돌린다.
      - name: Watch 앱 테스트
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "TennisCounter Watch App" \
            -destination "id=${{ steps.sim.outputs.watch }}" \
            -only-testing:RalliWatchTests \
            CODE_SIGNING_ALLOWED=NO -quiet test

      - name: 컴플리케이션 빌드
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "RalliComplicationExtension" \
            -destination "id=${{ steps.sim.outputs.watch }}" \
            CODE_SIGNING_ALLOWED=NO -quiet build

  haruchi-ios:
    name: HaruchiFit (iOS)
    needs: changes
    if: needs.changes.outputs.haruchi == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 선택
        run: .github/scripts/select-xcode.sh

      - name: 시뮬레이터 선택
        id: sim
        run: |
          echo "ios=$(.github/scripts/pick-simulator.sh iOS "$IOS_DEVICE")" >> "$GITHUB_OUTPUT"

      # 아직 iOS 테스트 타깃이 없어 빌드만 한다. 화면이 생기면 test 로 바꾼다.
      - name: iOS 앱 빌드
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "HaruchiFit" \
            -destination "id=${{ steps.sim.outputs.ios }}" \
            CODE_SIGNING_ALLOWED=NO -quiet build

  haruchi-watch:
    name: HaruchiFit (watchOS)
    needs: changes
    if: needs.changes.outputs.haruchi == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 선택
        run: .github/scripts/select-xcode.sh

      - name: 시뮬레이터 선택
        id: sim
        run: |
          echo "watch=$(.github/scripts/pick-simulator.sh watchOS "$WATCH_DEVICE")" >> "$GITHUB_OUTPUT"

      # golf/tennis 는 앱 스킴에 -only-testing 을 걸어 테스트한다 — 그쪽 워치 스킴에는
      # iOS 테스트 타깃까지 들어 있어 좁히지 않으면 중복 실행되기 때문이다.
      # 하루치 핏은 전용 테스트 스킴을 쓰므로 좁힐 필요가 없다.
      # 이 스킴이 호스트인 워치 앱까지 빌드하므로 별도 빌드 스텝을 두지 않는다.
      - name: Watch 앱 테스트
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "HaruchiFitWatchTests" \
            -destination "id=${{ steps.sim.outputs.watch }}" \
            CODE_SIGNING_ALLOWED=NO -quiet test

      - name: 컴플리케이션 빌드
        run: |
          xcodebuild -workspace "$WORKSPACE" -scheme "HaruchiComplicationExtension" \
            -destination "id=${{ steps.sim.outputs.watch }}" \
            CODE_SIGNING_ALLOWED=NO -quiet build
